base {
    archivesName = "${rootProject.archives_base_name}-common"
}

dependencies {
    // Provides the Sponge Mixin API used by the mixin classes (compile-time only).
    modCompileOnly "net.fabricmc:fabric-loader:${rootProject.loader_version}"

    // obscure-tooltips -- compile-time only, provided at runtime (not bundled)
    // Fabric variant jars contain identical bytecode for the shared API classes.
    modCompileOnly files(rootProject.file("libs/obscure_tooltips-fabric-${rootProject.obscure_tooltips_version}.jar"))
    modCompileOnly files(rootProject.file("libs/fragmentum-fabric-${rootProject.fragmentum_version}.jar"))

    // Cloth Config API -- compile-time only (optional at runtime).
    modCompileOnly "me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}"
}
