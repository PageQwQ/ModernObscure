base {
    archivesName = "${rootProject.archives_base_name}-neoforge"
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

    // obscure-tooltips -- compile-time only, provided at runtime (not bundled)
    modCompileOnly files(rootProject.file("libs/obscure_tooltips-neoforge-${rootProject.obscure_tooltips_version}.jar"))
    modCompileOnly files(rootProject.file("libs/fragmentum-neoforge-${rootProject.fragmentum_version}.jar"))
}

// Shared code lives in :common. It is compiled as part of this source set (not
// just bundled into the jar) so the classes are owned by the mod classloader on
// every loader -- NeoForge's TRANSFORMER loader rejects classes that resolve
// Minecraft through the app classloader.
sourceSets {
    main {
        java.srcDir project(':common').sourceSets.main.java
        resources.srcDir project(':common').sourceSets.main.resources
    }
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}
