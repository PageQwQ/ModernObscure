base {
    archivesName = "${rootProject.archives_base_name}-neoforge"
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

    // obscure-tooltips -- compile-time only, provided at runtime (not bundled)
    modCompileOnly files(rootProject.file("libs/obscure_tooltips-neoforge-${rootProject.obscure_tooltips_version}.jar"))
    modCompileOnly files(rootProject.file("libs/fragmentum-neoforge-${rootProject.fragmentum_version}.jar"))
}

jar {
    // Bundle all compiled classes + resources from common into the final jar
    from project(':common').sourceSets.main.output
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}
