base {
    archivesName = "${rootProject.archives_base_name}-fabric"
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"

    // obscure-tooltips -- compile-time only, provided at runtime (not bundled)
    modCompileOnly files(rootProject.file("libs/obscure_tooltips-fabric-${rootProject.obscure_tooltips_version}.jar"))
    modCompileOnly files(rootProject.file("libs/fragmentum-fabric-${rootProject.fragmentum_version}.jar"))
}

// Shared code lives in :common. It is compiled as part of this source set (not
// just bundled into the jar) so the classes are owned by the mod classloader on
// every loader -- NeoForge's TRANSFORMER loader rejects classes that resolve
// Minecraft through the app classloader.
sourceSets {
    main {
        java.srcDir project(':common').sourceSets.main.java
        resources.srcDir project(':common').sourceSets.main.resources
    }
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
