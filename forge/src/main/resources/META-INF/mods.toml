modLoader = "javafml"
loaderVersion = "[46,)"
license = "Apache-2.0"

[[mods]]
modId = "modernobscurecompat"
version = "${version}"
displayName = "ModernObscureCompat"
logoFile = "assets/modernobscurecompat/icon.png"
description = "Compatibility layer: renders ModernUI rounded tooltip backgrounds with obscure-tooltips features."

# Forge 1.20.1 uses mandatory=true/false; the type = "required" form is NeoForge 1.21+ only
[[dependencies.modernobscurecompat]]
modId = "forge"
mandatory = true
versionRange = "[46,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.modernobscurecompat]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1,1.20.2)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.modernobscurecompat]]
modId = "obscure_tooltips"
mandatory = true
versionRange = "*"
ordering = "NONE"
side = "CLIENT"

[[dependencies.modernobscurecompat]]
modId = "fragmentum"
mandatory = true
versionRange = "[5.0.0,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.modernobscurecompat]]
modId = "modernui"
mandatory = false
versionRange = "*"
ordering = "NONE"
side = "CLIENT"

[[mixins]]
config = "modernobscurecompat.mixins.json"
